spring:
  application:
    name: youth-guide-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

qnet:
  api:
    certificate-list:
      base-url: ${QNET_CERT_LIST_URL}
      key: ${QNET_CERT_LIST_KEY}
    exam-schedule:
      base-url: ${QNET_EXAM_SCHEDULE_URL}
      key: ${QNET_EXAM_SCHEDULE_KEY}