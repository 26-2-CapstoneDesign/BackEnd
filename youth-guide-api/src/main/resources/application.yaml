spring:
  application:
    name: youth-guide-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    # SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD 환경변수를 넣으면 실제 메일을 보낸다.
    # host가 없으면 인증번호를 서버 콘솔에만 출력한다 (개발용).
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  auth:
    # 로그인 상태 유지(remember-me) 쿠키 서명 키. 운영/개발 서버에서는 반드시 환경변수로 설정한다.
    remember-me-key: ${REMEMBER_ME_KEY}
  cors:
    # 프론트 개발 서버 주소(쉼표 구분)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    # 인증 메일 보내는 사람 주소
    from: ${MAIL_FROM:no-reply@youthguide.local}

qnet:
  api:
    certificate-list:
      base-url: ${QNET_CERT_LIST_URL}
      key: ${QNET_CERT_LIST_KEY}
    exam-schedule:
      base-url: ${QNET_EXAM_SCHEDULE_URL}
      key: ${QNET_EXAM_SCHEDULE_KEY}